<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page Editor</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">
	<!-- Prism.js CSS for syntax highlighting -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css" rel="stylesheet">
	<script type="module" src="teacher-auth.js"></script>
	<script type="module" src="page-editor.js"></script>
</head>

<body data-teacher-page="true">
	<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
		<h1>Page Editor</h1>
		<button onclick="window.teacherAuth.logout()" style="width: auto; padding: 0.3rem 1rem; background-color: #e53e3e; border-color: #e53e3e; color: white;">Logout</button>
	</div>

	<div id="teacherNav"></div>

	<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
		<label for="pageId">Page ID:</label>
		<div id="pageId" style="font-family: monospace; background-color: #f0f0f0; padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-height: 20px; display: inline-block; min-width: 200px;"></div>
	</div>

	<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 20px 0;">
		<button id="saveBtn" class="schedule-action-btn">Save</button>
		<button id="deleteBtn" class="schedule-action-btn delete-btn">Delete</button>
		<span id="unsavedIndicator" class="unsaved-indicator" style="display: none;">● Unsaved changes</span>
	</div>

	<h3>Markdown DSL:</h3>
	<textarea id="dslInput" rows="15" placeholder="Write your content here..."></textarea>

	<h3>Preview (as it will appear to visitors):</h3>
	<div id="preview" class="lesson-preview"></div>

	<h3>URLs</h3>
	<p>A page with no URL assigned exists but isn't reachable by anyone. A page can have more than one URL.</p>
	<ul id="slugList"></ul>
	<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
		<label for="newSlugInput">/p/</label>
		<input id="newSlugInput" type="text" placeholder="syllabus" style="flex: 1; min-width: 150px; max-width: 300px;">
		<button id="addSlugBtn" class="schedule-action-btn">Add URL</button>
	</div>

	<!-- Prism.js core and language components -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>

</html>
