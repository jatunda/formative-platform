<!-- practice-set-view.html -->
<!-- Not used in production - Firebase Hosting rewrites /practice/** straight to
     the practiceSetSSR Cloud Function (see functions/index.js and
     firebase.json), which returns its own HTML shell with link-preview meta
     tags baked in. This file exists for local dev/testing, where opening it
     directly with ?slug=<slug> is the only way to preview a Practice Set
     without deploying (mirrors page-view.html). -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Set</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css" rel="stylesheet">
  <script type="module" src="practice-view.js"></script>
</head>
<body>
  <h1 id="practiceSetTitle"></h1>
  <div id="content">
    <p class="loading-text">Loading...</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</body>
</html>
