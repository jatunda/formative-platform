<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Practice Sets</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="teacher-auth.js"></script>
	<script type="module" src="practice-set-manager.js"></script>
</head>

<body data-teacher-page="true">
	<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
		<h1>Practice Sets</h1>
		<button onclick="window.teacherAuth.logout()" style="width: auto; padding: 0.3rem 1rem; background-color: #e53e3e; border-color: #e53e3e; color: white;">Logout</button>
	</div>

	<div id="teacherNav"></div>

	<p>A Practice Set is an ordered list of Questions students work through via a shared link, in order.</p>

	<div style="margin: 20px 0;">
		<button id="newPracticeSetBtn" class="schedule-action-btn">New Practice Set</button>
	</div>

	<div id="practiceSetList"></div>
</body>

</html>
